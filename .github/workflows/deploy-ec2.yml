name: Deploy main to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

# A main deployment replaces application code only. Server-side .env.local
# remains the sole location for database and Groq credentials.
permissions:
  contents: read

concurrency:
  group: serinea-production-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install, test, type-check, and build
        run: |
          npm ci
          npx tsx --test $(find backend lib -name '*.test.ts' -print)
          npx tsc --noEmit
          DATABASE_URL='postgresql://placeholder:placeholder@localhost:5432/placeholder' REACH_DATA_SOURCE=database npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      EC2_DEPLOY_HOST: ${{ secrets.EC2_DEPLOY_HOST }}
      EC2_DEPLOY_USER: ${{ secrets.EC2_DEPLOY_USER }}
      EC2_DEPLOY_KNOWN_HOSTS: ${{ secrets.EC2_DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait 30 seconds before deployment
        run: sleep 30

      - name: Create source package without credentials or legacy runtime data
        run: |
          tar -czf /tmp/serinea-main-${GITHUB_SHA::7}.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.env \
            --exclude=.env.local \
            --exclude='data/locality_poi_summary_iteration1.csv' \
            --exclude='data/regional_pois_detail_optimized_iteration1.csv' \
            --exclude='docs/SERINEA_FRONTEND_BACKEND_ARCHITECTURE.drawio' \
            .

      - name: Configure dedicated SSH deployment access
        env:
          EC2_DEPLOY_SSH_KEY: ${{ secrets.EC2_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and activate the verified main revision
        run: |
          archive="/tmp/serinea-main-${GITHUB_SHA::7}.tar.gz"
          remote_archive="serinea-main-${GITHUB_SHA::7}.tar.gz"
          remote_release="/opt/serinea-release-${GITHUB_SHA::7}"
          scp "$archive" "$EC2_DEPLOY_USER@$EC2_DEPLOY_HOST:/home/$EC2_DEPLOY_USER/$remote_archive"
          ssh "$EC2_DEPLOY_USER@$EC2_DEPLOY_HOST" "set -e; \
            sudo rm -rf '$remote_release' /opt/serinea-previous; \
            sudo install -d -o $EC2_DEPLOY_USER -g $EC2_DEPLOY_USER '$remote_release'; \
            tar -xzf /home/$EC2_DEPLOY_USER/$remote_archive -C '$remote_release'; \
            sudo cp /opt/serinea/.env.local '$remote_release/.env.local'; \
            sudo chown -R $EC2_DEPLOY_USER:$EC2_DEPLOY_USER '$remote_release'; \
            cd '$remote_release'; npm ci; npm run build; \
            sudo systemctl stop serinea; \
            sudo mv /opt/serinea /opt/serinea-previous; \
            sudo mv '$remote_release' /opt/serinea; \
            if sudo systemctl start serinea && \
              (for attempt in {1..20}; do curl -fsS http://127.0.0.1:5173/api/health && exit 0; sleep 2; done); then \
              sudo rm -rf /opt/serinea-previous; \
            else \
              sudo systemctl stop serinea || true; \
              sudo rm -rf /opt/serinea; \
              sudo mv /opt/serinea-previous /opt/serinea; \
              sudo systemctl start serinea; \
              exit 1; \
            fi"
